# ---- 4. ABOUT -------------------------------------------------------------
about:
  kicker: "About"
  heading_plain: "A T cell biologist who wants science to be "
  heading_accent: "true"
  # Each "- >-" below is one paragraph. Add or remove paragraphs freely.
  paragraphs:
    - >-
      I work on killer T cells: the white blood cells that find infected and
      cancerous cells and kill them. The question I'd like to spend a career on
      is a simple one — how does the way we live change the way our immune cells
      work? Diet, sleep, exercise, stress; the daily swing between light and
      dark; the slow business of getting older. All of it leaves a mark on our
      cells, and I want to know what that mark is.
    - >-
      Right now I'm most taken with biological rhythms. Our bodies run on
      roughly 24-hour clocks, yet when we grow cells in the lab — including the
      T cells now being manufactured as cancer therapies — we grow them in flat,
      clockless conditions. I think that's a mistake, and a fixable one.
    - >-
      Since August 2026 I've been in Pallav Kosuri's lab at Salk, where I've
      taken on a second question: how the physical mechanics of a cell, the
      forces and tension at its surface, decide whether a killer T cell actually
      manages to kill. It's the biophysics of the moment of the kill.
    - >-
      I care just as much about whether science can be trusted in the first
      place. Too much of it doesn't replicate, and the incentives reward the
      wrong things — a tidy story over a true one. I write about this on my
      Substack, <a href="https://adam.rochussen.xyz">Fruit of Eden</a>, and on
      <a href="https://x.com/AdamRochussen">X</a>; in 2026 I co-authored a
      formal takedown of a widely-cited "brain sex" paper in <em>Theory and
      Society</em>.
    - >-
      And I'd like to build things, not only describe them. I'm the inventor on
      a provisional patent in adoptive T cell therapy, and I'm working towards a
      company — solo, for now.
    - >-
      Before San Diego I spent a decade at Cambridge: BA, MSci, MRes, and a
      Wellcome Trust-funded PhD with <a href="https://www.griffiths-lab.com/">Gillian
      Griffiths</a>. I moved to California in January 2025.
  # The little "stats panel" beside the text.
  glance_title: "Player stats"
  glance:
    - { dt: "Now",          dd: "Postdoctoral Fellow, Salk Institute (Kosuri Lab)" }
    - { dt: "Focus",        dd: "T cells · biological rhythms · cell therapy · meta-science" }
    - { dt: "Trained",      dd: "University of Cambridge — BA, MSci, MRes, PhD" }
    - { dt: "Fellowships",  dd: "Wellcome Trust PhD · Roots of Progress 2026" }
    - { dt: "Writing",      dd: "<a href=\"https://adam.rochussen.xyz\">Fruit of Eden</a> on Substack" }
    - { dt: "Outside",      dd: "Marathons (3:11 at CIM 2025), Ironman 70.3, and chasing good coffee" }

