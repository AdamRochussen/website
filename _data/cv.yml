profile:
  - >-
    I'm a T cell biologist interested in where human physiology meets cellular
    immunology: how do dynamic changes in the body change the way our immune
    cells work? Some of those changes we choose — diet, exercise, sleep, stress.
    Others we don't — the daily clock, and the slow arc of ageing. My current
    focus is biological rhythms and T cell immunity against cancer, and
    engineering better adoptive T cell therapies out of it.
  - >-
    I care just as much about meta-science and research rigour, which I write
    about as a 2026 Roots of Progress Fellow, and I'm working towards a company
    as a solo biotech founder.

