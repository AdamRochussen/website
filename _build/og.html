<!doctype html><html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"PS";src:url("../assets/fonts/pressstart2p-normal-400-latin.woff2") format("woff2")}
  @font-face{font-family:"DM";font-weight:400;src:url("../assets/fonts/dmsans-normal-400-latin.woff2") format("woff2")}
  @font-face{font-family:"DM";font-weight:500;src:url("../assets/fonts/dmsans-normal-500-latin.woff2") format("woff2")}
  html,body{margin:0}
  body{width:1200px;height:630px;background:#0e1018;color:#eef1ff;font-family:DM,sans-serif;position:relative;overflow:hidden}
  .stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 60px 80px,rgba(210,220,255,.7),transparent),radial-gradient(2px 2px at 300px 200px,rgba(210,220,255,.6),transparent),radial-gradient(2px 2px at 900px 120px,rgba(54,224,198,.6),transparent),radial-gradient(1.5px 1.5px at 500px 500px,rgba(210,220,255,.5),transparent),radial-gradient(2px 2px at 1050px 420px,rgba(210,220,255,.5),transparent),radial-gradient(1.5px 1.5px at 180px 430px,rgba(210,220,255,.45),transparent);background-size:1200px 630px}
  .frame{position:absolute;inset:24px;border:3px solid rgba(130,160,235,.35)}
  .wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column;justify-content:center}
  .kick{display:inline-flex;align-items:center;gap:14px;font-family:PS;font-size:15px;letter-spacing:2px;color:#36e0c6;text-transform:uppercase;margin-bottom:34px}
  .kick::before{content:"";width:12px;height:12px;background:#36e0c6;box-shadow:16px 0 0 #36e0c6}
  h1{font-family:PS;font-size:62px;line-height:1.3;margin:0;text-transform:uppercase}
  h1 .a{color:#36e0c6;text-shadow:5px 5px 0 rgba(4,5,12,.9)}
  .sub{font-size:28px;color:#bcc4e8;max-width:620px;margin-top:34px;line-height:1.45}
  .sub b{color:#36e0c6;font-weight:500}
  .foot{position:absolute;left:80px;bottom:70px;display:flex;gap:24px;align-items:center;font-family:PS;font-size:13px;letter-spacing:1px;color:#868fb8;text-transform:uppercase}
  .foot .d{width:9px;height:9px;background:#36e0c6}
  .avatar{position:absolute;right:80px;top:135px;width:300px}
  .avatar .tag{position:absolute;top:-16px;left:14px;background:#36e0c6;color:#081218;font-family:PS;font-size:12px;padding:8px 10px;z-index:2}
  .card{background:#171a2b;border:3px solid rgba(130,160,235,.45);box-shadow:10px 10px 0 rgba(4,5,12,.9);padding:14px}
  .card img{width:100%;height:330px;object-fit:cover;object-position:50% 26%;display:block}
  .life{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:2px solid rgba(130,150,230,.2);font-family:PS;font-size:12px;color:#bcc4e8}
  .hearts span{display:inline-block;width:16px;height:15px;background:#ff5d7e;-webkit-mask:url("../assets/img/sprites/heart-mono.svg") center/contain no-repeat;margin-left:3px}
</style></head>
<body>
  <div class="stars"></div><div class="frame"></div>
  <div class="wrap">
    <div class="kick">Salk Institute</div>
    <h1>Adam<br><span class="a">Rochussen</span></h1>
    <div class="sub">T cell biology, biological rhythms &amp; <b>the integrity of science.</b></div>
  </div>
  <div class="avatar">
    <span class="tag">Player 1</span>
    <div class="card"><img src="../assets/img/adam-800.jpg" alt=""><div class="life"><span>Rochussen</span><span class="hearts"><span></span><span></span><span></span></span></div></div>
  </div>
  <div class="foot"><span>rochussen.xyz</span><span class="d"></span><span>Roots of Progress Fellow 2026</span></div>
</body></html>
