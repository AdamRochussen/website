<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Bodoni Moda"; font-weight: 400 900; src: url("../assets/fonts/bodoni-moda-normal-latin.woff2") format("woff2"); }
  @font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400 900; src: url("../assets/fonts/bodoni-moda-italic-latin.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 300 700; src: url("../assets/fonts/jost-normal-latin.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #0b0a08; color: #f2ead7; font-family: Jost, sans-serif; position: relative; overflow: hidden; }
  .glow { position: absolute; inset: 0; background: radial-gradient(50% 70% at 78% 45%, rgba(212,176,98,.22), transparent 70%); }
  .burst { position: absolute; left: 935px; top: 300px; width: 1100px; height: 1100px; transform: translate(-50%,-50%); background: #d4b062; opacity: .2;
    -webkit-mask-image: url("../assets/img/sunburst.svg"), radial-gradient(closest-side, #000 25%, transparent 100%);
    -webkit-mask-size: contain, 100% 100%; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; -webkit-mask-composite: source-in; }
  .frame { position: absolute; inset: 22px; border: 1px solid rgba(212,176,98,.45); outline: 1px solid rgba(212,176,98,.2); outline-offset: 6px; }
  .arch { position: absolute; left: 790px; top: 92px; width: 300px; height: 400px; border-radius: 999px 999px 0 0; overflow: hidden; box-shadow: 0 30px 60px -20px #000; }
  .arch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 26%; }
  .arch-line { position: absolute; left: 776px; top: 78px; width: 328px; height: 414px; border: 1px solid rgba(212,176,98,.55); border-bottom: 0; border-radius: 999px 999px 0 0; }
  .plinth { position: absolute; left: 760px; top: 492px; width: 360px; height: 1px; background: #d4b062; box-shadow: 0 9px 0 -0px rgba(212,176,98,.45); }
  .text { position: absolute; left: 92px; top: 120px; width: 640px; }
  .eyebrow { font: 500 15px/1 Jost; letter-spacing: .32em; text-transform: uppercase; color: #dcbb70; display: flex; align-items: center; gap: 14px; }
  .eyebrow::before { content: ""; width: 9px; height: 9px; background: #d4b062; transform: rotate(45deg); }
  h1 { margin: 26px 0 0; font: 500 98px/.92 "Bodoni Moda"; text-transform: uppercase; letter-spacing: .01em;
       background: linear-gradient(105deg,#8f6c2c 0%,#e3c578 22%,#b48c3c 42%,#f5e3a8 58%,#b8913f 78%,#e7cd85 100%); -webkit-background-clip: text; color: transparent; }
  p.sub { margin: 30px 0 0; font: 400 26px/1.4 Jost; color: #d2c8b1; max-width: 560px; }
  p.sub em { font-family: "Bodoni Moda"; color: #dcbb70; }
  .foot { position: absolute; left: 92px; bottom: 70px; display: flex; gap: 26px; font: 500 14px/1 Jost; letter-spacing: .26em; text-transform: uppercase; color: #9f9581; }
  .foot span + span::before { content: "◆"; color: #d4b062; margin-right: 26px; font-size: 9px; vertical-align: 2px; }
</style></head>
<body>
  <div class="glow"></div><div class="burst"></div><div class="frame"></div>
  <div class="arch-line"></div><div class="arch"><img src="../assets/img/adam-800.jpg" alt=""></div><div class="plinth"></div>
  <div class="text">
    <div class="eyebrow">Salk Institute for Biological Studies</div>
    <h1>Adam<br>Rochussen</h1>
    <p class="sub">T cell biology, biological rhythms &amp; <em>the integrity of science.</em></p>
  </div>
  <div class="foot"><span>rochussen.xyz</span><span>Roots of Progress Fellow 2026</span></div>
</body></html>
